<body>
<script src="../js/main.js"></script><script>buildNav('module5');</script>
<div class="pg-top"><div class="wrap"><p class="crumb"><a href="../index.html">Home</a> › Module 5</p>
  <h1>Glossary of Terms</h1>
  <p>A searchable A-Z reference of all visualization and trading terminology used throughout this course.</p>
</div></div>

<div class="section"><div class="wrap">
  <div style="position:relative;margin-bottom:16px">
    <input type="text" id="srch" placeholder="🔍 Search terms..." oninput="search(this.value)" style="padding-left:14px;font-size:1rem">
  </div>
  <div id="gc"></div>
  <div class="lnav">
    <a href="../module4/drawdown-analysis.html" class="btn btn-outline">← Module 4</a>
    <a href="backtesting.html" class="btn btn-blue">Next: Backtesting →</a>
  </div>
</div></div>

<script>
const TERMS=[
  {t:'Alpha',d:'Excess return relative to a benchmark. Positive alpha = outperformed the market.'},
  {t:'Ask Price',d:'The lowest price a seller will accept. When you buy at market, you pay the ask price.'},
  {t:'ATR (Average True Range)',d:'Volatility indicator measuring average daily range. Used to set stop-losses and position sizes.'},
  {t:'Backtesting',d:'Testing a trading strategy on historical data. Distinct from paper trading (forward testing).'},
  {t:'Bear Market',d:'A market decline of 20%+ from recent highs. Associated with negative sentiment.'},
  {t:'Beta',d:'How much a stock moves relative to the market. Beta 1.5 = moves 1.5× as much as the index.'},
  {t:'Bid Price',d:'The highest price a buyer will pay. When you sell at market, you receive the bid price.'},
  {t:'Bid-Ask Spread',d:'The gap between ask and bid price. The implicit cost of a market order.'},
  {t:'Bollinger Bands',d:'A 20-period SMA with upper/lower bands at 2 standard deviations. Measures volatility.'},
  {t:'Breakout',d:'When price moves beyond a key support or resistance level with increased volume.'},
  {t:'Bull Market',d:'A period of rising prices, typically a 20%+ gain from recent lows.'},
  {t:'Buying Power',d:'Capital available to open new positions. Cash plus any available margin.'},
  {t:'Calmar Ratio',d:'Annual return divided by maximum drawdown. A risk-adjusted performance metric.'},
  {t:'Candlestick',d:'Chart element displaying Open, High, Low, Close for a time period. Body = O-C range; wicks = H-L range.'},
  {t:'Channel',d:'Price pattern where price moves between two parallel trendlines.'},
  {t:'Correlation',d:'How consistently two assets move together. Ranges from -1 (opposite) to +1 (identical).'},
  {t:'Day Trading',d:'All positions opened and closed within the same trading day. No overnight exposure.'},
  {t:'Death Cross',d:'Bearish signal: short-term MA crosses below long-term MA (e.g., 50-day below 200-day).'},
  {t:'Divergence',d:'Price makes a new high/low but an indicator fails to confirm it. Often signals a reversal.'},
  {t:'Drawdown',d:'Decline from a peak in equity to a subsequent trough. Maximum drawdown = worst decline.'},
  {t:'EMA (Exponential Moving Average)',d:'Moving average giving more weight to recent prices. More responsive than SMA but more noise.'},
  {t:'Equity Curve',d:'Chart showing growth or decline of a trading account over time. Best way to evaluate strategy health.'},
  {t:'Golden Cross',d:'Bullish signal: short-term MA crosses above long-term MA (e.g., 50-day above 200-day).'},
  {t:'Head and Shoulders',d:'Bearish reversal pattern: three peaks (left shoulder, head, right shoulder). Sell when neckline breaks.'},
  {t:'Heikin-Ashi',d:'Modified candlesticks that average OHLC values to smooth price action and reveal trends more clearly.'},
  {t:'Ichimoku Cloud',d:'Japanese indicator showing trend, momentum, and support/resistance using five lines and a cloud area.'},
  {t:'Limit Order',d:'Order to buy/sell at a specific price or better. Guarantees price but not fill.'},
  {t:'Liquidity',d:'Ease of buying/selling without affecting price. Liquid assets have tight bid-ask spreads.'},
  {t:'MACD',d:'Moving Average Convergence Divergence. Momentum indicator using two EMAs to identify trend shifts.'},
  {t:'Margin',d:'Borrowed money from a broker to increase buying power. Amplifies both gains and losses.'},
  {t:'Market Order',d:'Order to buy/sell immediately at best available price. Guaranteed fill, not guaranteed price.'},
  {t:'Maximum Drawdown',d:'Largest peak-to-trough decline in a portfolio. A key risk evaluation metric.'},
  {t:'Moving Average',d:'Indicator that smooths price by averaging closing prices over a set number of periods.'},
  {t:'OHLC',d:'Open, High, Low, Close — the four key data points that define any price bar or candlestick.'},
  {t:'Paper Trading',d:'Simulated trading with virtual money. Allows learning market mechanics without financial risk.'},
  {t:'Position Sizing',d:'Determining how much capital to risk per trade. Never risk more than 1-2% of account per trade.'},
  {t:'R-Multiple',d:'Trade result expressed as ratio of gain/loss to initial risk. +2R = made twice your initial risk.'},
  {t:'Resistance',d:'Price level where selling pressure halts a rally. Previous highs often act as resistance.'},
  {t:'Risk/Reward Ratio',d:'Ratio of potential loss to potential gain. 1:2 = risk $1 to make $2.'},
  {t:'RSI (Relative Strength Index)',d:'Momentum oscillator 0-100. Above 70 = overbought; below 30 = oversold.'},
  {t:'Sector Rotation',d:'Flow of investment capital between industry sectors as economic conditions change.'},
  {t:'Sharpe Ratio',d:'Risk-adjusted return = (Return − Risk-Free Rate) / Standard Deviation. Above 1.0 is good.'},
  {t:'Slippage',d:'Difference between expected and actual execution price. Common in fast-moving or illiquid markets.'},
  {t:'SMA (Simple Moving Average)',d:'Arithmetic average of closing prices over a set period. Equal weight to all periods.'},
  {t:'Stop-Loss Order',d:'Pre-set order to exit if price moves against you. Limits maximum loss on any trade.'},
  {t:'Support',d:'Price level where buying demand prevents further decline. Previous lows often act as support.'},
  {t:'Take-Profit Order',d:'Pre-set order to close at a specific profit target. Locks in gains automatically.'},
  {t:'Technical Analysis',d:'Study of past price and volume data to forecast future movements.'},
  {t:'Trend',d:'General direction of price movement. Uptrend = higher highs and higher lows.'},
  {t:'Trendline',d:'Straight line connecting price pivots. Uptrend lines connect swing lows.'},
  {t:'VIX',d:'CBOE Volatility Index — the "Fear Index." High VIX = fear; Low VIX = complacency.'},
  {t:'Volatility',d:'Degree of price variation over time. High = large swings; Low = stable movements.'},
  {t:'Volume',d:'Number of shares traded during a period. High volume confirms price moves.'},
  {t:'Volume Profile',d:'Trading volume at each price level as a horizontal histogram. Reveals the Point of Control.'},
  {t:'Wedge',d:'Pattern where two converging trendlines move in the same direction. Rising = bearish; Falling = bullish.'},
  {t:'Win Rate',d:'Percentage of trades that are profitable. High win rate alone does not mean profitability.'},
];
TERMS.sort((a,b)=>a.t.localeCompare(b.t));
function buildGlossary(filter){
  let html='',cur='';
  TERMS.filter(x=>!filter||x.t.toLowerCase().includes(filter.toLowerCase())||x.d.toLowerCase().includes(filter.toLowerCase())).forEach(x=>{
    const l=x.t[0].toUpperCase();
    if(l!==cur){cur=l;html+=`<div class="gletter">${l}</div>`;}
    html+=`<dl class="gl"><dt>${x.t}</dt><dd>${x.d}</dd></dl>`;
  });
  document.getElementById('gc').innerHTML=html||'<p style="color:#3d4f66;text-align:center;padding:32px">No terms found.</p>';
}
function search(v){buildGlossary(v);}
buildGlossary();
</script>
</body></html>
